<!DOCTYPE html>
<html>

<head>
 <title>My page</title>

 <style>

  header {
    background-color: rgba(190,230,230,0.9);
    padding: 5px;
    border-bottom-left-radius: 10px;
    border-bottom-right-radius: 10px;
  }

  main {
    background-color: rgba(250,250,255,1);
    padding: 20px;
    margin: 0px;
  }
  
  img {
    width: 300px;
    display: block;
    margin: 10px 0;
    border-radius: 50px;
  }
  
  footer {
    background-color: rgba(190,190,255,0.5);
    padding: 5px;
  }

  h1 {
    color: rgba(0, 50, 100, 1);
  }

  a {
    color: rgba(0, 80, 200, 1);
    text-decoration: none;
    transition: 0.2s;
  }

  a:hover {
    color: rgba(200,50,200,1);
  }

  body {
    background-color: rgba(250,250,255,1);
    margin: 0;
    padding: 0;
  }
 </style>
</head>

<body>

 <header>
  <h1>My page</h1>
 </header>

 <main>
  <h2>Welcome to my page!</h2>
  <p>HTML実験場だよ</p>
  <img src="image1.png" width="300" alt="ハルウララ（ウマ娘）">
  <h2>URL表示</h2>
  <a href="https://google.com" target="_blank">googleのURL</a>
  <a href="https://youtube.com" target="_blank">YoutubeのURL</a>
  <a href="https://nicovideo.jp" target="_blank">ニコ動のURL</a>
  <h2>日時表示(日本時間)</h2>
  <p id="time"></p>
 </main>

 <footer>
  <p>※これはテスト用HTMLです</p>
 </footer>

  <script>
   function updateTime() {
    const now = new Date();
    const text = now.toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' });
    document.getElementById("time").textContent = text;
   }
 
   setInterval(updateTime, 1000);
   updateTime();
  </script>

</body>

</html>
